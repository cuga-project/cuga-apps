# Ouroboros watsonx model config — gpt-oss-120b for every CUGA internal node.
#
# This OVERRIDES the llama-4-maverick default that ships in cuga's packaged
# settings.watsonx.toml. main.py points AGENT_SETTING_CONFIG at this file (by
# absolute path) when LLM_PROVIDER=watsonx, so the supervisor + all specialists
# run on gpt-oss-120b — the model the lead-hunt cascade was tuned/verified on.
#
# If your watsonx instance exposes gpt-oss under a different id, change the
# `model_name` values below (one per node).

[agent.task_decomposition.model]
platform = "watsonx"
model_name = "openai/gpt-oss-120b"
temperature = 0.1
max_tokens = 16000

[agent.shortlister.model]
platform = "watsonx"
model_name = "openai/gpt-oss-120b"
temperature = 0.1
max_tokens = 16000


# bharat-core-cuga-agent-app — Bharat Core Services: agents built for India, hosted together in one
# Code Engine app. Today it serves Farm Assistant (Voice agent): multilingual voice RAG over a
# farming handbook. Listed on the gallery home page via cuga-apps/ui/src/data/bharatServices.ts.
#
# An EXTERNAL app: its source and Dockerfile live in their own repo, and it runs as
# its own Code Engine app (own origin, own secret, own restarts) next to the
# cuga-agent-apps all-in-one. Sourced by build_external.sh and deploy_external.sh.
#
# Why separate: users paste their own Sarvam API key into this app's page. On its
# own origin no other app's code can reach that page; inside the all-in-one it
# would share an origin with every other app.

# ── identity ──────────────────────────────────────────────────────────────────
UI_ID="farm-assistant"                      # id in cuga-apps/ui/src/data/bharatServices.ts
CE_APP="bharat-core-cuga-agent-app"                   # Code Engine app name → public URL
SOURCE_REPO="https://github.ibm.com/Anupama-Murthi/CUGA-Voice-RAG-Agent"
SOURCE_REF="anu/ce-ready"
IMAGE_NAME="bharat-core-cuga-agent-app"               # icr.io/<namespace>/<IMAGE_NAME>:<tag>

# ── runtime ───────────────────────────────────────────────────────────────────
PORT=28831
# The index + 2.2 GB multilingual embedding model are baked into the image and
# loaded in memory; 4 vCPU / 16G leaves headroom for concurrent questions.
CPU=4
MEMORY=16G
EPHEMERAL_STORAGE=4G
# ONE instance: the app's rate limiter (cuga-apps _ratelimit.py) keeps its
# counters in memory, and the knowledge store holds an exclusive file lock.
MIN_SCALE=1
MAX_SCALE=1
# Code Engine's own per-instance cap. The app's RL_CONCURRENCY (default 3) is the
# real gate on concurrent LLM calls; this just bounds queued connections.
CONCURRENCY=20
REQUEST_TIMEOUT=300

# ── secret (<CE_APP>-env), assembled by deploy_external.sh ──────────────────────
# Least privilege: copy ONLY these keys from the gallery's secret (it also holds
# Tavily, Alpha Vantage, RITS, LiteLLM and COS credentials this app must not see),
# set these literals, then merge apps/<app>.env if present (app-only values such
# as the OIDC client secret). No value is ever printed.
SECRET_FROM="cuga-agent-apps-env"
SECRET_KEYS="WATSONX_APIKEY WATSONX_URL WATSONX_PROJECT_ID WATSONX_SPACE_ID USAGE_TOKEN"
SECRET_SET="LLM_PROVIDER=watsonx USAGE_COLLECTOR_URL=https://cuga-agent-apps.1gxwxi8kos9y.us-east.codeengine.appdomain.cloud/a/usage-collector/track AUTH_MODE=off"
# Usage goes to the PRODUCTION gallery's collector, so this app's stats sit with every other
# app's (USAGE_TOKEN above is production's, so /track accepts it).
# Sign-in is OFF: the app is public, and rate limits fall back to the client IP
# (RL_TRUST_FORWARDED=1 in the image). To turn sign-in back on, set AUTH_MODE=oidc plus
# OIDC_REDIRECT_URI here and put the OIDC_* values in apps/bharat-core-cuga-agent-app.env
# (see the .env.example); without them the app FAILS CLOSED with 503s.

# ── health ────────────────────────────────────────────────────────────────────
# /ready = 200 only once the index is loaded, so no traffic arrives before then.
PROBE_READY_PATH="/ready"
# /health = liveness. Generous initial delay: the first /ready builds the agent.
PROBE_LIVE_PATH="/health"

# ── build (build_external.sh) ─────────────────────────────────────────────────
DOCKERFILE="Dockerfile"
BUILD_SIZE="xlarge"                         # Code Engine build size (ce mode)
BUILD_TIMEOUT=3600                          # seconds; the build runs PDF ingestion

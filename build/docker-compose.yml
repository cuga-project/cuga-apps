# build/docker-compose.yml — bring up the all-in-one image locally.
#
#   cd build
#   cp .env.example .env        # fill in your LLM provider + key
#   docker compose up --build
#   open http://localhost:8080
#
# Build context is the repo root so the image can COPY cuga-apps/{apps,mcp_servers,
# ui,requirements.apps.txt} and build/. Requires BuildKit (default in modern
# Docker) so build/Dockerfile.dockerignore is honored.
#
# The MCP servers are bundled INTO the image and run on loopback, so there are
# no sibling services here — the whole environment is this one container.
# CUGA_TARGET stays at the image default (local); do not override it to `ce`,
# which would try to redirect the apps to a hosted MCP deployment.
services:
  cuga-agent-apps:
    build:
      context: ..
      dockerfile: build/Dockerfile
      # Build under the host's network namespace so apt/npm use the host's
      # working DNS resolver. The default bridge inherits an IBM Cloud VPC
      # resolv.conf whose first nameservers (9.0.0.x) are unreachable from
      # inside a container, so name resolution to deb.debian.org / npm
      # registry fails ("Temporary failure resolving 'deb.debian.org'").
      network: host
      # Build provenance (shown on the internal stats dashboard). Compose can't
      # run git, so these read from the host env and default to empty — a plain
      # `docker compose build` shows "dev build". To stamp a local build, export
      # them first, e.g.:
      #   export CUGA_GIT_COMMIT=$(git rev-parse --short HEAD) \
      #          CUGA_GIT_SHA=$(git rev-parse HEAD) \
      #          CUGA_GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD) \
      #          CUGA_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
      args:
        CUGA_BUILD_TIME: "${CUGA_BUILD_TIME:-}"
        CUGA_GIT_COMMIT: "${CUGA_GIT_COMMIT:-}"
        CUGA_GIT_SHA: "${CUGA_GIT_SHA:-}"
        CUGA_GIT_BRANCH: "${CUGA_GIT_BRANCH:-}"
        CUGA_GIT_SUBJECT: "${CUGA_GIT_SUBJECT:-}"
        CUGA_GIT_COMMIT_TIME: "${CUGA_GIT_COMMIT_TIME:-}"
    image: cuga-apps-allinone:latest
    container_name: cuga-agent-apps
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
